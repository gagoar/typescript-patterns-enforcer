name: release-engine

# Builds the engine from source in CI, checks it against the committed
# engine/dist/*.js (four readable files), and attaches them (plus SHA256SUMS) to
# the GitHub Release.
#   - pull request: build and verify only; nothing is published
#   - push to main (engine changes): build and verify only. Two PRs can each pass
#     alone and still leave a stale bundle once both merge (one regenerates dist
#     without the other's sources). The pull request run cannot see that, because
#     it ran before the other PR merged; this run checks the merged result and
#     fails main's check until the bundle is rebuilt.
#   - push of a v* tag: build, verify, publish to that tag's release
#   - manual run: attach the engine to an EXISTING release (give the tag)
# Uses the workflow's own GITHUB_TOKEN; no PAT.

on:
  pull_request:
    paths: ["engine/**", ".github/workflows/release-engine.yml"]
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/release-engine.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the engine to (e.g. v0.3.2)"
        required: true

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # Only a tag push or a manual run publishes; a pull request or a push to main only verifies.
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tag matches plugin.json
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          want="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' .claude-plugin/plugin.json | head -1)"
          [ "$TAG" = "v$want" ] || { echo "tag $TAG != v$want (plugin.json)"; exit 1; }

      - name: Build the engine
        working-directory: engine
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: The committed bundle must reproduce
        run: |
          git add --intent-to-add engine/dist
          git diff --exit-code -- engine/dist

      - name: Test
        working-directory: engine
        run: node --test test/run.test.mjs

      - name: Publish to the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd engine/dist
          sha256sum check.js stop.js acorn.js acorn-typescript.js > SHA256SUMS
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" check.js stop.js acorn.js acorn-typescript.js SHA256SUMS --clobber
